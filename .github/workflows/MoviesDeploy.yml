name: Movies CI/CD With Fastlane

run-name: ${{ github.actor }} is building ${{ inputs.environment || 'auto' }} environment with ${{ inputs.build_type || 'auto' }} build

env:
  # The name of the main module repository
  main_project_module: app

  # The name used in artifact names
  playstore_name: MoviesApp

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      build_type:
        description: 'Choose build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# Add permissions for test reporting
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  Movies-Actions:
    runs-on: ubuntu-latest
    env:
      # Keystore, Fastlane'ın injected signing properties için gerekli ENV'ler
      RELEASE_STORE_FILE: keystore.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ./keystore.jks

    steps:
      - name: Determine build configuration
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            BUILD_TYPE="${{ inputs.build_type }}"
            BRANCH_REF="${{ inputs.ref }}"
          else
            # Auto-determine based on branch
            if [ "${{ github.ref_name }}" == "main" ]; then
              ENV="prod"
              BUILD_TYPE="release"
            else
              ENV="dev"
              BUILD_TYPE="debug"
            fi
            BRANCH_REF="${{ github.ref }}"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "branch_ref=$BRANCH_REF" >> $GITHUB_OUTPUT
          echo "gradle_task=assemble${ENV^}${BUILD_TYPE^}" >> $GITHUB_OUTPUT
          echo "test_task=test${ENV^}${BUILD_TYPE^}UnitTest" >> $GITHUB_OUTPUT
          echo "artifact_name=${ENV^}${BUILD_TYPE^}" >> $GITHUB_OUTPUT
          
          echo "Building: $ENV $BUILD_TYPE from $BRANCH_REF"
          echo "Gradle task: assemble${ENV^}${BUILD_TYPE^}"

      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.config.outputs.branch_ref }}

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Decode keystore from secrets (conditional for release builds)
      - name: Decode keystore from secrets
        if: steps.config.outputs.build_type == 'release'
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Missing KEYSTORE_BASE64 secret for release build"; exit 1;
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ls -l "$ANDROID_KEYSTORE_PATH"
          echo "✅ Keystore successfully decoded"

      # Debug: List files in root directory
      - name: List root directory (Debug)
        run: |
          echo "Files in root directory:"
          ls -la
          echo "Current working directory: $(pwd)"


      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install gems
        run: bundle install --path vendor/bundle

      - name: Lint (Fastlane)
        run: bundle exec fastlane checks

      - name: Run Unit Tests (Fastlane)
        run: bundle exec fastlane tests

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unit Test Results (${{ steps.config.outputs.artifact_name }})
          path: ${{ env.main_project_module }}/build/test-results/test*UnitTest/

      - name: Upload Unit Test Report (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unit Test HTML Report (${{ steps.config.outputs.artifact_name }})
          path: ${{ env.main_project_module }}/build/reports/tests/test*UnitTest/

      - name: Publish Test Results to GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests (${{ steps.config.outputs.artifact_name }})
          path: ${{ env.main_project_module }}/build/test-results/test*UnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build signed APK (Fastlane)
        env:
          BUILD_ENVIRONMENT: ${{ steps.config.outputs.environment }}
          BUILD_TYPE: ${{ steps.config.outputs.build_type }}
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
        run: bundle exec fastlane apk_release

      - name: Find APK file
        id: find_apk
        run: |
          ENV_LOWER=$(echo "${{ steps.config.outputs.environment }}" | tr '[:upper:]' '[:lower:]')
          BUILD_TYPE_LOWER=$(echo "${{ steps.config.outputs.build_type }}" | tr '[:upper:]' '[:lower:]')
          
          # Try the specific flavor/build type directory first
          APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/${ENV_LOWER}/${BUILD_TYPE_LOWER}/ -name "*.apk" -type f | head -1)
          
          # If not found, try the release directory as fallback
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "No APK found! Checking all output directories:"
            find ${{ env.main_project_module }}/build/outputs/apk/ -name "*.apk" -type f
            exit 1
          fi
          
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.playstore_name }} - ${{ steps.config.outputs.artifact_name }} APK
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create Build Summary
        run: |
          echo "## 🚀 Movies CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.config.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ steps.config.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Ref**: ${{ steps.config.outputs.branch_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path**: ${{ steps.find_apk.outputs.apk_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          fi