name: PR Validation - All Tests

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened ]

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Java JDK
        uses: actions/setup-java@v4.4.0
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Determine Target Flavor
        id: target_flavor
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "flavor=Dev" >> $GITHUB_OUTPUT
            echo "flavor_lower=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "flavor=Prod" >> $GITHUB_OUTPUT  
            echo "flavor_lower=prod" >> $GITHUB_OUTPUT
          fi

      - name: Run All Unit Tests
        run: |
          echo "🧪 Running all unit tests for all modules..."
          ./gradlew test --continue --stacktrace

  #      - name: Run Instrumented Tests (App Module)
  #        run: |
  #          echo "🤖 Running instrumented tests for app module..."
  #          ./gradlew connected${{ steps.target_flavor.outputs.flavor }}DebugAndroidTest --continue --stacktrace

  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Java JDK
        uses: actions/setup-java@v4.4.0
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Lint Checks
        run: ./gradlew lint --continue

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lint-results
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml